<!-- Modal de Login -->
<div id="loginModal" class="modal-overlay">
    <div class="modal">
        <div class="modal-header">
            <h2 class="modal-title">Entrar no Sistema</h2>
            <button class="modal-close">&times;</button>
        </div>
        
        <div class="modal-body">
            <form method="POST" action="#" class="ajax-form" data-url="{% url 'ajax_login' %}">
                {% csrf_token %}
                
                <div class="form-group">
                    <label class="form-label" for="id_username">CPF ou Email</label>
                    <input 
                        type="text" 
                        name="username" 
                        id="id_username"
                        class="form-input"
                        placeholder="Digite seu CPF ou email"
                        required
                    >
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="id_password">Senha</label>
                    <input 
                        type="password" 
                        name="password" 
                        id="id_password"
                        class="form-input"
                        placeholder="Digite sua senha"
                        required
                    >
                </div>
                
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" name="remember_me">
                        <span class="checkmark"></span>
                        Lembrar de mim
                    </label>
                </div>
                
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline modal-close">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Entrar</button>
                </div>
            </form>
        </div>
    </div>
</div>
