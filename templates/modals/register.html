<!-- Modal de Cadastro -->
<div id="registerModal" class="modal-overlay">
    <div class="modal">
        <div class="modal-header">
            <h2 class="modal-title">Criar Conta</h2>
            <button class="modal-close">&times;</button>
        </div>
        
        <div class="modal-body">
            <form method="POST" action="#" class="ajax-form" data-url="{% url 'ajax_register' %}">
                {% csrf_token %}
                
                <div class="grid grid-cols-2">
                    <div class="form-group">
                        <label class="form-label" for="id_first_name">Nome</label>
                        <input 
                            type="text" 
                            name="first_name" 
                            id="id_first_name"
                            class="form-input"
                            placeholder="Seu nome"
                            required
                        >
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="id_last_name">Sobrenome</label>
                        <input 
                            type="text" 
                            name="last_name" 
                            id="id_last_name"
                            class="form-input"
                            placeholder="Seu sobrenome"
                            required
                        >
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="id_email">Email</label>
                    <input 
                        type="email" 
                        name="email" 
                        id="id_email"
                        class="form-input"
                        placeholder="seu.email@exemplo.com"
                        required
                    >
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="id_cpf">CPF</label>
                    <input 
                        type="text" 
                        name="cpf" 
                        id="id_cpf"
                        class="form-input"
                        placeholder="000.000.000-00"
                        maxlength="14"
                        required
                    >
                </div>
                
                <div class="grid grid-cols-2">
                    <div class="form-group">
                        <label class="form-label" for="id_password1">Senha</label>
                        <input 
                            type="password" 
                            name="password1" 
                            id="id_password1"
                            class="form-input"
                            placeholder="Mínimo 8 caracteres"
                            required
                        >
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="id_password2">Confirmar Senha</label>
                        <input 
                            type="password" 
                            name="password2" 
                            id="id_password2"
                            class="form-input"
                            placeholder="Repita a senha"
                            required
                        >
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="id_telefone">Telefone (opcional)</label>
                    <input 
                        type="tel" 
                        name="telefone" 
                        id="id_telefone"
                        class="form-input"
                        placeholder="(00) 00000-0000"
                    >
                </div>
                
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" name="terms" required>
                        <span class="checkmark"></span>
                        Aceito os <a href="#" class="link">termos de uso</a> e <a href="#" class="link">política de privacidade</a>
                    </label>
                </div>
                
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline modal-close">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Criar Conta</button>
                </div>
            </form>
        </div>
    </div>
</div>
