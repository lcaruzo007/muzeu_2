{% extends 'base.html' %}
{% block title %}{{ object.titulo }} | Notícias{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <article class="card shadow-sm border-0 mb-4">
                {% if object.imagem %}
                <img src="{{ object.imagem.url }}" class="card-img-top" alt="{{ object.titulo }}">
                {% endif %}
                <div class="card-body">
                    <h1 class="card-title mb-3">{{ object.titulo }}</h1>
                    <p class="text-muted small mb-4">Publicado em {{ object.data_publicacao|date:'d M Y' }}</p>
                    <div class="card-text mb-4">{{ object.conteudo|linebreaks }}</div>
                    <a href="{% url 'noticias:lista' %}" class="btn btn-outline-secondary btn-sm">← Voltar para notícias</a>
                </div>
            </article>
        </div>
    </div>
</div>
{% endblock %}
